<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="447" viewBox="0 0 1200 447" role="img" aria-labelledby="trust-title trust-desc">
<title id="trust-title">ruDevolution evidence boundaries</title><desc id="trust-desc">A cryptographic witness can support source and output byte integrity, but cannot prove semantic equivalence, exact names, authorship or execution safety.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06121e"/><stop offset=".48" stop-color="#0b1325"/><stop offset="1" stop-color="#161129"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34e8e3"/><stop offset=".55" stop-color="#7bb9ff"/><stop offset="1" stop-color="#b493ff"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#51f5e3" stop-opacity=".24"/><stop offset="1" stop-color="#51f5e3" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7296bb" stroke-opacity=".11" stroke-width="1"/></pattern>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
</defs><style>
  .trace{stroke-dasharray:5 13;animation:trace 4s linear infinite}
  .traceSlow{stroke-dasharray:4 13;animation:trace 7s linear infinite}
  .glimmer{animation:glimmer 3.4s ease-in-out infinite}
  .glimmer2{animation:glimmer 4.7s ease-in-out -1.2s infinite}
  .hover{animation:hover 5s ease-in-out infinite}
  .scan{animation:scan 5.5s ease-in-out infinite}
  .rise{animation:rise 4.8s ease-in-out infinite}
  @keyframes trace{to{stroke-dashoffset:-72}}
  @keyframes glimmer{0%,100%{opacity:.4}50%{opacity:1}}
  @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes scan{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:.8;transform:translateY(35px)}}
  @keyframes rise{0%,100%{opacity:.42}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.trace,.traceSlow,.glimmer,.glimmer2,.hover,.scan,.rise{animation:none!important}}
</style>
<rect width="1200" height="447" rx="22" fill="url(#bg)"/>
<rect width="1200" height="447" rx="22" fill="url(#grid)" opacity=".7"/>
<text x="47" y="43" fill="#6fe6dc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="700">EVIDENCE MODEL</text>
<text x="47" y="84" fill="#f1f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750">Integrity is not equivalence</text>
<text x="47" y="113" fill="#b0c3d1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="500">Keep byte verification, naming quality, and runtime behavior as separate claims.</text>
<rect x="47" y="145" width="525" height="218" rx="17" fill="#0a292e" stroke="#327e74" />
<rect x="611" y="145" width="540" height="218" rx="17" fill="#211b2e" stroke="#685076" />
<text x="70" y="183" fill="#6bf2d5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" font-weight="750">WITNESS SUPPORTS</text>
<text x="635" y="183" fill="#d0a9f7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" font-weight="750">WITNESS DOES NOT ESTABLISH</text>
<text x="71" y="221" fill="#c9f3e5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="500">● source and artifact byte integrity</text>
<text x="71" y="252" fill="#c9f3e5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="500">● module order and content hashes</text>
<text x="71" y="283" fill="#c9f3e5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="500">● reproducible tamper detection</text>
<text x="635" y="221" fill="#e1d5ec" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="500">× semantic equivalence or runnable safety</text>
<text x="635" y="252" fill="#e1d5ec" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="500">× original author intent / exact names</text>
<text x="635" y="283" fill="#e1d5ec" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="500">× identity, provenance or signed authorship</text>
<text x="70" y="338" fill="#79e9d2" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="750">VERIFY AGAINST TRUSTED BYTES</text>
<text x="635" y="338" fill="#e0b28a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="750">REQUIRE INDEPENDENT TESTS</text>
<path d="M47 392H1152" fill="none" stroke="#354e68" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<text x="48" y="416" fill="#e9bb8d" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700">SECURITY BOUNDARY</text>
<text x="241" y="416" fill="#bbced9" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="500">Input JavaScript remains data. Never execute it to validate decompilation.</text>
<rect x="1" y="1" width="1198" height="445" rx="21" fill="none" stroke="#7996bb" stroke-opacity=".34"/>
</svg>