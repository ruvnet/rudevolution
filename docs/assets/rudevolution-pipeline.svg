<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="pipeline-title pipeline-desc">
<title id="pipeline-title">ruDevolution five phase pipeline</title><desc id="pipeline-desc">Parse JavaScript, build a reference graph, partition candidate modules, infer names with confidence, and build a SHA3-256 content witness. A witness is not a semantic or authorship proof.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06121e"/><stop offset=".48" stop-color="#0b1325"/><stop offset="1" stop-color="#161129"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34e8e3"/><stop offset=".55" stop-color="#7bb9ff"/><stop offset="1" stop-color="#b493ff"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#51f5e3" stop-opacity=".24"/><stop offset="1" stop-color="#51f5e3" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7296bb" stroke-opacity=".11" stroke-width="1"/></pattern>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
</defs><style>
  .trace{stroke-dasharray:5 13;animation:trace 4s linear infinite}
  .traceSlow{stroke-dasharray:4 13;animation:trace 7s linear infinite}
  .glimmer{animation:glimmer 3.4s ease-in-out infinite}
  .glimmer2{animation:glimmer 4.7s ease-in-out -1.2s infinite}
  .hover{animation:hover 5s ease-in-out infinite}
  .scan{animation:scan 5.5s ease-in-out infinite}
  .rise{animation:rise 4.8s ease-in-out infinite}
  @keyframes trace{to{stroke-dashoffset:-72}}
  @keyframes glimmer{0%,100%{opacity:.4}50%{opacity:1}}
  @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes scan{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:.8;transform:translateY(35px)}}
  @keyframes rise{0%,100%{opacity:.42}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.trace,.traceSlow,.glimmer,.glimmer2,.hover,.scan,.rise{animation:none!important}}
</style>
<rect width="1280" height="470" rx="22" fill="url(#bg)"/>
<rect width="1280" height="470" rx="22" fill="url(#grid)" opacity=".7"/>
<text x="45" y="44" fill="#69eada" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="700">INSIDE THE ENGINE</text>
<text x="45" y="88" fill="#eef7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="750">Five phases. Explicit boundaries.</text>
<text x="45" y="114" fill="#abc4d5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="500">Each phase enriches the representation. A witness binds bytes; it does not prove behavior.</text><rect x="45" y="152" width="216" height="219" rx="15" fill="#0b1d31" stroke="#375066" /><rect x="59" y="167" width="43" height="34" rx="9" fill="#193244" stroke="#42697c" /><text x="69" y="190" fill="#6ef4df" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" font-weight="750">01</text><text x="61" y="239" fill="#e7f5fc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" font-weight="750">PARSE</text><text x="61" y="269" fill="#b2c9dd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Tokenize and scan</text><text x="61" y="300" fill="#95adc1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="500">declarations · strings</text><text x="61" y="322" fill="#95adc1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="500">memchr + scanner</text><path d="M60 348H246" fill="none" stroke="#6ef4df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".6" class="trace"/><path d="M262 263h21" fill="none" stroke="#6ef4df" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="trace"/><rect x="284" y="152" width="216" height="219" rx="15" fill="#0b1d31" stroke="#375066" /><rect x="298" y="167" width="43" height="34" rx="9" fill="#193244" stroke="#42697c" /><text x="308" y="190" fill="#75cef1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" font-weight="750">02</text><text x="300" y="239" fill="#e7f5fc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" font-weight="750">GRAPH</text><text x="300" y="269" fill="#b2c9dd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Link references</text><text x="300" y="300" fill="#95adc1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="500">weighted edges</text><text x="300" y="322" fill="#95adc1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="500">who calls whom</text><path d="M299 348H485" fill="none" stroke="#75cef1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".6" class="trace"/><path d="M501 263h21" fill="none" stroke="#75cef1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="trace"/><rect x="523" y="152" width="216" height="219" rx="15" fill="#0b1d31" stroke="#375066" /><rect x="537" y="167" width="43" height="34" rx="9" fill="#193244" stroke="#42697c" /><text x="547" y="190" fill="#8cabff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" font-weight="750">03</text><text x="539" y="239" fill="#e7f5fc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" font-weight="750">PARTITION</text><text x="539" y="269" fill="#b2c9dd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Discover groups</text><text x="539" y="300" fill="#95adc1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="500">MinCut / Louvain</text><text x="539" y="322" fill="#95adc1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="500">candidate modules</text><path d="M538 348H724" fill="none" stroke="#8cabff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".6" class="trace"/><path d="M740 263h21" fill="none" stroke="#8cabff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="trace"/><rect x="762" y="152" width="216" height="219" rx="15" fill="#0b1d31" stroke="#375066" /><rect x="776" y="167" width="43" height="34" rx="9" fill="#193244" stroke="#42697c" /><text x="786" y="190" fill="#b39bff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" font-weight="750">04</text><text x="778" y="239" fill="#e7f5fc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" font-weight="750">INFER</text><text x="778" y="269" fill="#b2c9dd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Suggest names</text><text x="778" y="300" fill="#95adc1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="500">patterns + model</text><text x="778" y="322" fill="#95adc1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="500">confidence per name</text><path d="M777 348H963" fill="none" stroke="#b39bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".6" class="trace"/><path d="M979 263h21" fill="none" stroke="#b39bff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="trace"/><rect x="1001" y="152" width="216" height="219" rx="15" fill="#0b1d31" stroke="#375066" /><rect x="1015" y="167" width="43" height="34" rx="9" fill="#193244" stroke="#42697c" /><text x="1025" y="190" fill="#e6bb91" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" font-weight="750">05</text><text x="1017" y="239" fill="#e7f5fc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" font-weight="750">WITNESS</text><text x="1017" y="269" fill="#b2c9dd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Bind artifacts</text><text x="1017" y="300" fill="#95adc1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="500">SHA3-256 Merkle</text><text x="1017" y="322" fill="#95adc1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="500">integrity record</text><path d="M1016 348H1202" fill="none" stroke="#e6bb91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".6" class="trace"/><path d="M45 408H1231" fill="none" stroke="#2b5266" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
<text x="45" y="435" fill="#62eadb" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="750">ARTIFACTS</text>
<text x="160" y="435" fill="#d1e7f1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="500">readable modules</text><text x="375" y="435" fill="#d1e7f1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="500">source map</text>
<text x="553" y="435" fill="#d1e7f1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="500">confidence report</text><text x="814" y="435" fill="#d1e7f1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="500">witness manifest</text>
<text x="1087" y="435" fill="#e4bc88" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="750">VERIFY BYTES</text>
<rect x="1" y="1" width="1278" height="468" rx="21" fill="none" stroke="#7996bb" stroke-opacity=".34"/>
</svg>