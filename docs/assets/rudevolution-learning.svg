<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="425" viewBox="0 0 1240 425" role="img" aria-labelledby="learning-title learning-desc">
<title id="learning-title">ruDevolution learning loop</title><desc id="learning-desc">A human-reviewed learning cycle connects correction evidence to pattern training, future proposals, and held-out evaluation. Better accuracy must be measured independently.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06121e"/><stop offset=".48" stop-color="#0b1325"/><stop offset="1" stop-color="#161129"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34e8e3"/><stop offset=".55" stop-color="#7bb9ff"/><stop offset="1" stop-color="#b493ff"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#51f5e3" stop-opacity=".24"/><stop offset="1" stop-color="#51f5e3" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7296bb" stroke-opacity=".11" stroke-width="1"/></pattern>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
</defs><style>
  .trace{stroke-dasharray:5 13;animation:trace 4s linear infinite}
  .traceSlow{stroke-dasharray:4 13;animation:trace 7s linear infinite}
  .glimmer{animation:glimmer 3.4s ease-in-out infinite}
  .glimmer2{animation:glimmer 4.7s ease-in-out -1.2s infinite}
  .hover{animation:hover 5s ease-in-out infinite}
  .scan{animation:scan 5.5s ease-in-out infinite}
  .rise{animation:rise 4.8s ease-in-out infinite}
  @keyframes trace{to{stroke-dashoffset:-72}}
  @keyframes glimmer{0%,100%{opacity:.4}50%{opacity:1}}
  @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes scan{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:.8;transform:translateY(35px)}}
  @keyframes rise{0%,100%{opacity:.42}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.trace,.traceSlow,.glimmer,.glimmer2,.hover,.scan,.rise{animation:none!important}}
</style>
<rect width="1240" height="425" rx="22" fill="url(#bg)"/>
<rect width="1240" height="425" rx="22" fill="url(#grid)" opacity=".7"/>
<text x="45" y="43" fill="#6ee8dc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="700">HUMAN-IN-THE-LOOP</text>
<text x="45" y="85" fill="#f1f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="750">Corrections become better candidates</text>
<text x="45" y="113" fill="#a8c2d1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="500">A feedback architecture: label → pattern learning → inference → measured review.</text>
<path d="M123 235H1030" fill="none" stroke="#446e84" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="trace"/><rect x="45" y="159" width="263" height="153" rx="16" fill="#0e1e32" stroke="#355c71" /><text x="62" y="186" fill="#5ee4df" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="750">01</text><text x="62" y="221" fill="#f1f8ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="750">REVIEW</text><text x="62" y="249" fill="#bfd3e2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">Analyst labels a name</text><text x="62" y="273" fill="#92aebe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500">with source evidence</text><rect x="340" y="159" width="263" height="153" rx="16" fill="#0e1e32" stroke="#355c71" /><text x="357" y="186" fill="#7cc7f2" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="750">02</text><text x="357" y="221" fill="#f1f8ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="750">LEARN</text><text x="357" y="249" fill="#bfd3e2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">Store corrected patterns</text><text x="357" y="273" fill="#92aebe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500">for future inference</text><rect x="635" y="159" width="263" height="153" rx="16" fill="#0e1e32" stroke="#355c71" /><text x="652" y="186" fill="#aa9afa" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="750">03</text><text x="652" y="221" fill="#f1f8ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="750">PROPOSE</text><text x="652" y="249" fill="#bfd3e2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">Generate candidate names</text><text x="652" y="273" fill="#92aebe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500">with confidence scores</text><rect x="930" y="159" width="263" height="153" rx="16" fill="#0e1e32" stroke="#355c71" /><text x="947" y="186" fill="#ecc99a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="750">04</text><text x="947" y="221" fill="#f1f8ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="750">EVALUATE</text><text x="947" y="249" fill="#bfd3e2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">Hold out unseen bundles</text><text x="947" y="273" fill="#92aebe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500">measure before adoption</text><path d="M1070 322V354Q1070 371 1050 371H135Q114 371 114 352V322" fill="none" stroke="#a7a1fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 12" class="traceSlow"/><text x="405" y="394" fill="#ecc99a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="500">Feedback never replaces validation of a changed program.</text>
<rect x="1" y="1" width="1238" height="423" rx="21" fill="none" stroke="#7996bb" stroke-opacity=".34"/>
</svg>